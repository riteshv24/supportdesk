services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supportdesk
      POSTGRES_USER: supportdesk
      POSTGRES_PASSWORD: ${SUPPORTDESK_DB_PASSWORD:?Set SUPPORTDESK_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportdesk -d supportdesk"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://supportdesk:${SUPPORTDESK_DB_PASSWORD}@db:5432/supportdesk
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
