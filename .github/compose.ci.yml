services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: app_ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-only-disposable-password
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ci -d app_ci']
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    image: backend-ci:${CI_IMAGE_TAG:?Run from CI or set a local test image tag}
    environment:
      DATABASE_URL: postgresql+psycopg://ci:ci-only-disposable-password@db:5432/app_ci
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  frontend:
    image: frontend-ci:${CI_IMAGE_TAG:?Run from CI or set a local test image tag}
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      backend:
        condition: service_healthy
