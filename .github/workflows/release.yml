name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version tag, for example v0.2.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  validate:
    name: Validate merged PR and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a new version on a merged PR commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/validate_release.py
  verify:
    name: Verify release commit
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    name: Publish tested images and version
    needs: [validate, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-${{ github.sha }}
          path: ci-artifacts
      - name: Verify and load the tested image archive
        run: |
          cd ci-artifacts
          sha256sum --check SHA256SUMS
          docker load --input images.tar.gz
      - name: Authenticate to GitHub Container Registry
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the tested images without rebuilding
        run: |
          for component in backend frontend; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-$component"
            docker tag "$component-ci:$GITHUB_SHA" "$image:$RELEASE_VERSION"
            docker tag "$component-ci:$GITHUB_SHA" "$image:sha-$GITHUB_SHA"
            docker push "$image:$RELEASE_VERSION"
            docker push "$image:sha-$GITHUB_SHA"
            docker inspect --format '{{index .RepoDigests 0}}' "$image:$RELEASE_VERSION" >> ci-artifacts/image-digests.txt
          done
      - name: Create versioned release with immutable image digests
        run: |
          gh release create "$RELEASE_VERSION" ci-artifacts/image-digests.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$RELEASE_VERSION" --generate-notes
      - name: Clear registry credentials
        if: always()
        run: docker logout ghcr.io
